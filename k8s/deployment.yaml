apiVersion: app/v1
kind: Deployment
metadata:
  name: myapp_deployment
  labels:
    app: myapp
spec:
  template:
    metadata:
      labels:
        app: myapp
    spec:
      template:
        metadata:
          name: myapp-pod
          labels:
            app: myapp
        spec:
          containers:
          - name: python-container
            image: mansidevops1912/fastapi/python-proejct:latest
            ports:
            - containerPort: 8000

  selector:
    matchlabels:
      app: myapp
  replicas: 2
